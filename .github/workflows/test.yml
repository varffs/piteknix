name: test

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 18 is the floor declared in package.json "engines".
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # Hardware drivers are optionalDependencies: native ones (i2c-bus, onoff)
      # build on the Linux runner, and a failed build does not fail the install.
      - run: npm ci
      # The suite runs in virtual mode with injected drivers: no Pi hardware needed.
      - run: npm test
